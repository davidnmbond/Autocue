<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Autocue</title>
	<style>
		body {
			margin: 0;
			font-family: sans-serif;
			overflow: hidden; /* Prevent scrolling on the body */
		}
		#toolbar {
			position: fixed; /* Pin the toolbar to the top */
			top: 0; /* Align it to the top of the screen */
			left: 0;
			width: 100%; /* Make it span the full width of the screen */
			height: 40px;
			padding: 5px 10px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: var(--toolbar-bg);
			z-index: 1000; /* Ensure it stays above other elements */
		}
		#editor, #presenter {
			margin-top: 40px; /* Add space below the toolbar */
			width: 100%;
			height: calc(100vh - 40px); /* Adjust height to account for the toolbar */
			box-sizing: border-box;
			padding: 10px;
			resize: none;
			border: none;
			outline: none;
			font-size: var(--font-size, 12px); /* Reduced base font size */
		}
		#editor {
			overflow-y: auto; /* Enable vertical scrolling for the editor */
			overflow-x: hidden; /* Prevent horizontal scrolling */
		}
		:root {
			--font-size: 12px; /* Reduced from 24px to 12px */
			--toolbar-bg: #f0f0f0;
			--text-color: #000;
			--bg-color: #fff;
		}
		body.dark {
			--toolbar-bg: #333;
			--text-color: #fff;
			--bg-color: #000;
		}
		#presenter {
			color: #fff;
			background: #000;
			overflow-y: auto; /* Enable vertical scrolling for the presenter */
			overflow-x: hidden; /* Prevent horizontal scrolling */
			white-space: pre-wrap;
			line-height: 1.25; /* Word wrapping line spacing: 1 + 1/4 of font height */
			font-size: calc(var(--font-size, 12px) * 1.5); /* Increased font size for presenter mode */
			height: 100vh; /* Ensure it takes up the full viewport height */
			box-sizing: border-box; /* Include padding in height calculation */
			padding-bottom: 1em; /* Add padding to avoid text touching the bottom */
		}
		body.dark #presenter {
			scrollbar-color: #555 #222; /* Dark scrollbar with lighter thumb */
			scrollbar-width: thin; /* Make the scrollbar thinner */
		}
		body.dark #presenter::-webkit-scrollbar {
			width: 8px; /* Width of the scrollbar */
		}
		body.dark #presenter::-webkit-scrollbar-thumb {
			background-color: #555; /* Darker thumb */
			border-radius: 4px; /* Rounded edges */
		}
		body.dark #presenter::-webkit-scrollbar-track {
			background-color: #222; /* Darker track */
		}
		#presenter p {
			margin: 0; /* Remove default margins */
			margin-bottom: 0.375em; /* Reduced paragraph spacing from 0.75em to 0.375em */
		}
		.dim {
			opacity: 0.3;
		}
		#voiceStatus {
			margin-left: 10px;
			font-size: 0.9em;
			color: gray;
		}
		body.dark #editor {
			background: var(--bg-color);
			color: var(--text-color);
			}
		#vuMeterContainer {
			width: 100%;
			height: 10px;
			background: linear-gradient(to right, green, yellow, red); /* Gradient background */
			position: fixed; /* Pin it to the screen */
			top: 40px; /* Place it directly below the toolbar */
			left: 0;
			z-index: 999; /* Ensure it stays above other elements but below the toolbar */
			overflow: hidden; /* Ensure the overlay stays within bounds */
			display: block; /* Default display */
		}

		#vuMeter {
			height: 100%;
			width: 100%; /* Start fully covering the container */
			background-color: black; /* Black overlay */
			transition: width 0.05s ease-in-out; /* Smooth shrinking */
			position: absolute;
			right: 0; /* Start from the right */
		}

		#vuMeterContainer.hidden {
			display: none; /* Hide the VU meter when toggled off */
		}

		body.presentation #vuMeterContainer {
			top: 0; /* Pin it to the very top in presentation mode */
		}

		/* Toggle switch styling */
		.toggle-switch {
			position: relative;
			display: inline-block;
			width: 34px;
			height: 20px;
		}

		.toggle-switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}

		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #ccc;
			transition: 0.4s;
			border-radius: 20px;
		}

		.slider:before {
			position: absolute;
			content: '';
			height: 14px;
			width: 14px;
			left: 3px;
			bottom: 3px;
			background-color: white;
			transition: 0.4s;
			border-radius: 50%;
		}

		input:checked + .slider {
			background-color: #2196F3;
		}

		input:checked + .slider:before {
			transform: translateX(14px);
		}

		.greyed-out {
			color: grey;
			opacity: 0.5;
		}

		.active-word {
			color: #aaffaa; /* Slightly greener color for the active word */
		}

		.heading {
			color: #00aaff; /* Light blue */
			font-weight: bold;
			text-align: center; /* Center the heading */
			display: inline-block; /* Ensure it stays on the same line */
			margin: 1em 0; /* Add spacing around the heading */
			white-space: nowrap; /* Prevent line breaks within the heading */
	}

		#toolbar span {
			color: var(--text-color); /* Ensure toolbar text contrasts with the background */
			font-size: 0.9em;
			margin-left: 5px;
		}
	</style>
</head>
<body>
	<div id="toolbar">
		<span id="voiceStatus"></span>
		<div>
			<select id="fontSize">
				<option value="20px">Small</option>
				<option value="24px" selected>Medium</option>
				<option value="30px">Large</option>
				<option value="36px">Extra Large</option>
				<option value="42px">Huge</option>
			</select>
			<select id="scrollSmoothness">
				<option value="instant">Instant</option>
				<option value="smooth" selected>Smooth</option>
				<option value="very-smooth">Very Smooth</option>
				<option value="ultra-smooth">Ultra Smooth</option>
				<option value="glide">Glide</option>
			</select>
			<select id="wordSeekRange">
				<option value="3">3 Words</option>
				<option value="5" selected>5 Words</option>
				<option value="7">7 Words</option>
				<option value="10">10 Words</option>
			</select>
			 <label class="toggle-switch">
				<input type="checkbox" id="dictationToggle">
				<span class="slider"></span>
			</label>
			 <span>Dictation</span>
			<label class="toggle-switch">
				<input type="checkbox" id="vuMeterToggle" checked>
				<span class="slider"></span>
			</label>
			<span>VU Meter</span>
		</div>
		<button onclick="enterPresenter()">Present</button>
	</div>
	<div id="vuMeterContainer">
		<div id="vuMeter"></div>
	</div>
	<textarea id="editor" autofocus></textarea>
	<div id="presenter" style="display:none;"></div>

	<script>
	const dictationToggle = document.getElementById('dictationToggle');
	const vuMeter = document.getElementById('vuMeter');
	const vuMeterToggle = document.getElementById('vuMeterToggle');
	const editor = document.getElementById('editor');
	const presenter = document.getElementById('presenter');
	const fontSize = document.getElementById('fontSize');
	const voiceStatus = document.getElementById('voiceStatus');
	const scrollSmoothness = document.getElementById('scrollSmoothness');
	const wordSeekRange = document.getElementById('wordSeekRange');
	const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

	let editorCursorPosition = 0; // Variable to store the cursor position in the editor
	let recognition = null;
	let audioContext = null;
	let analyser = null;
	let microphone = null;
	let animationFrameId = null;
	let cursor = 0; // Global cursor variable
	let words = []; // Global words array

	// Respect user's dark mode preference in edit mode
	if (prefersDark) {
		document.body.classList.add('dark');
	}

	// Hide dictation toggle if voice recognition is unavailable
	if (window.SpeechRecognition || window.webkitSpeechRecognition) {
		voiceStatus.textContent = 'Voice recognition available';
		dictationToggle.parentElement.style.display = 'inline-block';
	} else {
		voiceStatus.textContent = 'Voice recognition not available';
		dictationToggle.parentElement.style.display = 'none';
	}

	// Font size change listener
	fontSize.addEventListener('change', () => {
		const selectedFontSize = fontSize.value;
		localStorage.setItem('fontSize', selectedFontSize);
		document.documentElement.style.setProperty('--font-size', selectedFontSize);
	});

	scrollSmoothness.addEventListener('change', () => {
		const selectedSmoothness = scrollSmoothness.value;
		localStorage.setItem('scrollSmoothness', selectedSmoothness);
	});

	// Save the word seek range to localStorage
	wordSeekRange.addEventListener('change', () => {
		localStorage.setItem('wordSeekRange', wordSeekRange.value);
	});

	// Save content to local storage whenever the editor's content changes
	editor.addEventListener('input', () => {
		localStorage.setItem('autocueText', editor.value);
		saveCursorPosition(); // Save cursor position on input
	});

	editor.addEventListener('mouseup', saveCursorPosition);
	editor.addEventListener('keyup', saveCursorPosition);

	function saveCursorPosition() {
		editorCursorPosition = editor.selectionStart; // Update the cursor position
		localStorage.setItem('editorCursorPosition', editorCursorPosition); // Save to localStorage
	}

	// Consolidated dictation toggle event listener
	dictationToggle.addEventListener('change', () => {
		if (dictationToggle.checked) {
			if (!audioContext) {
				audioContext = new AudioContext(); // Initialize AudioContext if not already created
			}
			if (audioContext.state === 'suspended') {
				audioContext.resume().then(() => {
					console.log('AudioContext resumed successfully.');
				}).catch((err) => {
					console.error('Error resuming AudioContext:', err);
				});
			}
			startDictation();
		} else {
			stopDictation();
		}
	});

	// Save the VU meter preference to localStorage
	vuMeterToggle.addEventListener('change', () => {
		const isVuMeterEnabled = vuMeterToggle.checked;
		localStorage.setItem('vuMeterEnabled', isVuMeterEnabled);
		toggleVuMeter(isVuMeterEnabled);
	});

	// Function to toggle the VU meter visibility
	function toggleVuMeter(isEnabled) {
		const vuMeterContainer = document.getElementById('vuMeterContainer');
		if (isEnabled) {
			vuMeterContainer.classList.remove('hidden');
		} else {
			vuMeterContainer.classList.add('hidden');
		}
	}

	// Ensure the VU meter updates correctly
	function startDictation() {
		if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
			alert('Speech recognition is not supported in this browser.');
			dictationToggle.checked = false;
			return;
		}

		// Reset recognition if it was previously stopped
		if (recognition) {
			recognition.stop();
			recognition = null;
		}

		recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
		recognition.continuous = true;
		recognition.interimResults = true;

		let lastTranscript = '';

		recognition.onresult = (event) => {
			const transcript = Array.from(event.results)
				.filter(result => result.isFinal)
				.map(result => result[0].transcript)
				.join('');

			// Process the transcript for punctuation and formatting
			let processedTranscript = transcript
				.replace(/\bfull stop\b/gi, '.') // Replace "full stop" with "."
				.replace(/\bquestion mark\b/gi, '?') // Replace "question mark" with "?"
				.replace(/\bcomma\b/gi, ',') // Replace "comma" with ","
				.replace(/\bexclamation mark\b/gi, '!') // Replace "exclamation mark" with "!"
				.replace(/\bcolon\b/gi, ':') // Replace "colon" with ":"
				.replace(/\bsemicolon\b/gi, ';') // Replace "semicolon" with ";"
				.replace(/\bnew paragraph\b/gi, '\n\n') // Replace "new paragraph" with a double newline
				.replace(/\s+([.,?!;:])/g, '$1') // Remove spaces before punctuation
				.replace(/([.,?!;:])([^\s])/g, '$1 $2') // Add space after punctuation if missing
				.replace(/^\s+|\s+$/g, '') // Trim leading/trailing spaces
				.replace(/\bellipsis\b/gi, '...') // Replace "ellipsis" with "..."
				.replace(/\bdot dot dot\b/gi, '...'); // Replace "dot dot dot" with "..."

			processedTranscript = processedTranscript.replace(/(?:^|[.?!;:]\s+)([a-z])/g, (match, p1) => p1.toUpperCase());

			// Check if the user said "delete last sentence"
			if (processedTranscript.toLowerCase().includes('delete last sentence')) {
				const content = editor.value.trim();
				const lastSentenceIndex = content.lastIndexOf('.');
				if (lastSentenceIndex !== -1) {
					editor.value = content.substring(0, lastSentenceIndex + 1).trim(); // Keep everything up to the last period
				} else {
					editor.value = ''; // If no sentence is found, clear the editor
				}
				localStorage.setItem('autocueText', editor.value); // Save updated content to local storage
				return; // Exit early to avoid appending "delete last sentence" to the editor
			}

			// Ensure only new content is appended
			const newContent = processedTranscript.replace(lastTranscript, '').trim();

			if (newContent) {
				const cursorPosition = editor.selectionStart;
				const textBeforeCursor = editor.value.substring(0, cursorPosition);
				const textAfterCursor = editor.value.substring(editor.selectionEnd);

				// Handle "new paragraph" on its own
				if (newContent === '\n\n') {
					editor.value = textBeforeCursor + '\n\n' + textAfterCursor;
				}
				// Handle standalone punctuation like "full stop" or "question mark"
				else if (['.', '?', '!', ':', ';'].includes(newContent)) {
					const trimmedTextBeforeCursor = textBeforeCursor.trimEnd();
					// Avoid redundant punctuation
					if (!trimmedTextBeforeCursor.endsWith(newContent)) {
						editor.value = trimmedTextBeforeCursor + newContent + textAfterCursor;
					}
				}
				// Handle regular text
				else {
					editor.value = textBeforeCursor + newContent + ' ' + textAfterCursor;
				}

				// Update the last transcript to the full processed transcript
				lastTranscript = processedTranscript;

				// Recalculate cursor position after insertion
				const newCursorPosition = editor.value.length - textAfterCursor.length;
				editor.setSelectionRange(newCursorPosition, newCursorPosition);

				// Save updated content to local storage
				localStorage.setItem('autocueText', editor.value);
			}
		};

		recognition.start();

		navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
			console.log('Microphone access granted:', stream);
			audioContext = new AudioContext();
			analyser = audioContext.createAnalyser();
			const microphone = audioContext.createMediaStreamSource(stream);
			console.log('Microphone connected to analyser:', microphone);
			analyser.fftSize = 256;
			microphone.connect(analyser);
			console.log('Analyser connected:', analyser);
			console.log('FFT Size:', analyser.fftSize);
			console.log('Frequency Bin Count:', analyser.frequencyBinCount);

			const dataArray = new Uint8Array(analyser.frequencyBinCount);

			function updateVuMeter() {
				analyser.getByteFrequencyData(dataArray);
				const volume = Math.max(...dataArray);
				const percentage = (volume / 255) * 100;

				// Shrink the black overlay based on the volume percentage
				vuMeter.style.width = `${100 - percentage}%`; // Black bar shrinks as volume increases

				requestAnimationFrame(updateVuMeter);
			}

			updateVuMeter();
		}).catch((err) => {
			console.error('Error accessing microphone:', err);
			alert('Microphone access is required for the VU meter to work.');
			dictationToggle.checked = false;
			dictationToggle.disabled = true; // Disable the toggle
		});
	}

	function stopDictation() {
		if (recognition) {
			recognition.stop();
			recognition = null;
		}

		if (audioContext) {
			console.log('Closing AudioContext...');
			audioContext.close();
			audioContext = null;
		}

		if (microphone && microphone.mediaStream) {
			console.log('Stopping microphone tracks...');
			const tracks = microphone.mediaStream.getTracks();
			tracks.forEach(track => track.stop());
			microphone = null;
		}

		if (animationFrameId) {
			console.log('Cancelling animation frame...');
			cancelAnimationFrame(animationFrameId);
			animationFrameId = null;
		}

		vuMeter.style.width = '0%'; // Reset the VU meter
	}

	function enterPresenter() {
		// Force dark mode in presentation mode
		document.body.classList.add('dark', 'presentation');
		document.getElementById('toolbar').style.display = 'none';
		editor.style.display = 'none';
		presenter.style.display = 'block';

		// Show the VU meter at the top if enabled
		const vuMeterContainer = document.getElementById('vuMeterContainer');
		if (vuMeterToggle.checked) {
			vuMeterContainer.style.display = 'block';
			vuMeterContainer.style.position = 'fixed';
		} else {
			vuMeterContainer.style.display = 'none';
		}

		// Scale font size for presentation mode
		const selectedFontSize = parseInt(fontSize.value, 10); // Parse font size as a number
		presenter.style.fontSize = `${selectedFontSize * 1.5}px`; // Scale font size for presentation mode

		// Split text into words and lines
		const paragraphs = editor.value.split(/\n\n+/);
		words = paragraphs.flatMap((p, i) => {
			const lineWords = p.split(/\s+/).map(word => ({ word, line: i, isHeading: p.startsWith('#') }));
			lineWords.push({ word: '\n', line: i, isHeading: p.startsWith('#') }); // Add a line break marker
			return lineWords;
		});

		// Initialize the cursor based on the editor's cursor position
		cursor = 0; // Default to the start
		let charCount = 0; // Track character count to map to the word index
		for (let i = 0; i < words.length; i++) {
			charCount += words[i].word.length + 1; // Add word length + 1 for the space
			if (charCount > editorCursorPosition) {
				cursor = i; // Set the cursor to the corresponding word index
				break;
			}
		}

		// Render the presenter content
		renderPresenter();
	}

	// Render the presenter content
	function renderPresenter() {
		let html = '';
		let isHeading = false;

		words.forEach((w, i) => {
				if (w.isHeading) {
						// Start a new heading block if it's a heading
						if (!isHeading) {
								html += `<span class="heading">`;
								isHeading = true;
						}
						html += `${w.word} `; // Add the word to the heading block
				} else {
						// Close the heading block if it ends
						if (isHeading) {
								html += `</span>`;
								isHeading = false;
						}

						// Render regular words
						if (w.word === '\n') {
								html += '<br>'; // Line break
						} else if (i < cursor) {
								html += `<span class="greyed-out">${w.word}</span> `;
						} else if (i === cursor) {
								html += `<span class="active-word">${w.word}</span> `;
						} else {
								html += `<span>${w.word}</span> `;
						}
				}
		});

		// Close any open heading block
		if (isHeading) {
				html += `</span>`;
		}

		presenter.innerHTML = html;

		// Scroll the active word into the vertical center of the screen
		const activeWordElement = presenter.querySelector('.active-word');
		if (activeWordElement) {
				const smoothness = scrollSmoothness.value; // Get the selected smoothness value

				// Check if the cursor is on the last line before a heading
				const nextHeadingIndex = words.findIndex((w, index) => index > cursor && w.isHeading);
				if (nextHeadingIndex !== -1) {
						const isLastLineBeforeHeading = words[cursor]?.line === words[nextHeadingIndex]?.line - 1;
						if (isLastLineBeforeHeading) {
								// Scroll the last line to the top of the screen
								activeWordElement.scrollIntoView({
										behavior: smoothness === 'instant' ? 'auto' : 'smooth',
										block: 'start', // Align the last line to the top of the screen
								});
								return; // Exit early to avoid centering the active word
						}
				}

				// Default behavior: center the active word vertically
				activeWordElement.scrollIntoView({
						behavior: smoothness === 'instant' ? 'auto' : 'smooth',
						block: 'center', // Center the active word vertically
				});
		}
}

	// Handle speech recognition
	try {
		recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
		recognition.continuous = true;
		recognition.interimResults = true;

		recognition.onresult = (e) => {
			const transcript = e.results[e.results.length - 1][0].transcript.toLowerCase();
			const spokenWords = transcript.split(/\s+/);

			for (const spokenWord of spokenWords) {
				if (!spokenWord) continue; // Skip empty words

				console.log(`Spoken word: "${spokenWord}"`); // Log the spoken word

				// Skip headings
				while (cursor < words.length && words[cursor].isHeading) {
					cursor++;
				}

				// Check if the spoken word matches the current word
				if (cursor < words.length && spokenWord === words[cursor].word.toLowerCase()) {
					console.log(`Matched expected word: "${words[cursor].word}" at cursor ${cursor}`);
					cursor++; // Move to the next word
				} else {
					// Look ahead or behind for a match with forward preference
					let found = false;
					let bestMatch = null;
					let bestMatchOffset = null;

					// Get the range from the dropdown
					const seekRange = parseInt(wordSeekRange.value, 10);

					for (let offset = 1; offset <= seekRange; offset++) {
						// Look ahead
						if (cursor + offset < words.length && spokenWord === words[cursor + offset].word.toLowerCase()) {
							const forwardWeight = 1 / offset; // Weight decreases with distance
							if (!bestMatch || forwardWeight > bestMatch.weight) {
								bestMatch = { position: cursor + offset, weight: forwardWeight };
								bestMatchOffset = offset;
							}
						}
						// Look behind
						if (cursor - offset >= 0 && spokenWord === words[cursor - offset].word.toLowerCase()) {
							const backwardWeight = 1 / (offset * 2); // Lower weight for backward matches
							if (!bestMatch || backwardWeight > bestMatch.weight) {
								bestMatch = { position: cursor - offset, weight: backwardWeight };
								bestMatchOffset = -offset;
							}
						}
					}

					if (bestMatch) {
						cursor = bestMatch.position; // Move to the best match
						console.log(
							`Matched nearby word: "${words[cursor].word}" at position ${cursor} (offset: ${bestMatchOffset})`
						);
						found = true;
					}

					if (!found) {
						// If no match is found, log the unmatched word
						console.warn(`Unmatched word: "${spokenWord}"`);
					}
				}

				// Skip headings after moving the cursor
				while (cursor < words.length && words[cursor].isHeading) {
					cursor++;
				}

				// Log the updated cursor position
				console.log(`Cursor moved to position: ${cursor}`);
			}

			// Update the presenter display
			renderPresenter();
		};

		recognition.start();
	} catch (e) {
		console.warn('Speech recognition not supported or blocked:', e);
	}

	function exitPresenter() {
		// Restore user's dark mode preference in edit mode
		document.body.classList.remove('presentation');
		if (!prefersDark) {
			document.body.classList.remove('dark');
		}

		document.getElementById('toolbar').style.display = 'flex';
		editor.style.display = 'block';
		presenter.style.display = 'none';

		// Reset the VU meter position
		const vuMeterContainer = document.getElementById('vuMeterContainer');
		vuMeterContainer.style.display = vuMeterToggle.checked ? 'block' : 'none';
		vuMeterContainer.style.position = 'relative';

		document.removeEventListener('keydown', presenterKeyHandler); // Remove presenter-specific key bindings

		if (recognition) recognition.stop(); // Stop speech recognition
		recognition = null;
	}

	// Consolidated keydown event handler
	document.addEventListener('keydown', (event) => {
		// Always exit presentation mode with Escape
		if (event.key === 'Escape') {
			exitPresenter();
			return;
		}

		// Enter presentation mode with Ctrl+Enter
		if (event.ctrlKey && event.key === 'Enter') {
			enterPresenter();
			return;
		}

		// Handle navigation keys in presentation mode
		if (presenter.style.display !== 'none') {
			switch (event.key) {
				case 'ArrowRight': // Move forward one word
					if (cursor < words.length - 1) cursor++;
					break;

				case 'ArrowLeft': // Move backward one word
					if (cursor > 0) cursor--;
					break;

				case 'ArrowDown': { // Move to the beginning of the next line
					const currentLine = words[cursor]?.line;
					const nextLineIndex = words.findIndex(w => w.line === currentLine + 1);
					if (nextLineIndex !== -1) {
						cursor = nextLineIndex;
					} else {
						cursor = words.length - 1; // Move to the last word if no next line
					}
					break;
				}

				case 'ArrowUp': { // Move to the beginning of the previous line
					const currentLine = words[cursor]?.line;
					const prevLineIndex = words.findIndex(w => w.line === currentLine - 1);
					if (prevLineIndex !== -1) {
						cursor = prevLineIndex;
					} else {
						cursor = 0; // Move to the first word if no previous line
					}
					break;
				}

				case 'Home': // Move to the start of the text
					cursor = 0;
					break;

				case 'End': // Move to the end of the text
					cursor = words.length - 1;
					break;

				case 'PageDown': { // Jump to the next heading
					const nextHeadingIndex = words.findIndex((w, index) => index > cursor && w.isHeading);
					if (nextHeadingIndex !== -1) {
						cursor = nextHeadingIndex;
					} else {
						cursor = words.length - 1; // Move to the last word if no more headings
					}
					break;
				}

				case 'PageUp': { // Jump to the previous heading
					const prevHeadingIndex = [...words]
						.reverse()
						.findIndex((w, index) => words.length - 1 - index < cursor && w.isHeading);
					if (prevHeadingIndex !== -1) {
						cursor = words.length - 1 - prevHeadingIndex;
					} else {
						cursor = 0; // Move to the first word if no previous headings
					}
					break;
				}
			}

			// Skip headings after moving the cursor
			while (cursor < words.length && words[cursor].isHeading) {
				cursor++;
			}

			// Update the presenter display
			renderPresenter();

			// Scroll the active word into the vertical center of the screen
			const activeWordElement = presenter.querySelector('.active-word');
			if (activeWordElement) {
				activeWordElement.scrollIntoView({
					behavior: 'smooth', // Smooth scrolling
					block: 'center', // Center the active word vertically
				});
			}
		}
	});

	// Load preferences and textarea content from localStorage
	window.addEventListener('DOMContentLoaded', () => {
		// Load textarea content
		const savedContent = localStorage.getItem('autocueText');
		if (savedContent !== null) {
				editor.value = savedContent; // Set the textarea content
		}

		// Load font size preference
		const savedFontSize = localStorage.getItem('fontSize');
		if (savedFontSize) {
				fontSize.value = savedFontSize;
				document.documentElement.style.setProperty('--font-size', savedFontSize);
		}

		// Load scroll smoothness preference
		const savedSmoothness = localStorage.getItem('scrollSmoothness');
		if (savedSmoothness) {
				scrollSmoothness.value = savedSmoothness;
		}

		// Load cursor position
		const savedCursorPosition = localStorage.getItem('editorCursorPosition');
		if (savedCursorPosition !== null) {
				editorCursorPosition = parseInt(savedCursorPosition, 10);
				editor.setSelectionRange(editorCursorPosition, editorCursorPosition); // Restore cursor position
		}

		// Load the word seek range from localStorage
		const savedWordSeekRange = localStorage.getItem('wordSeekRange');
		if (savedWordSeekRange) {
				wordSeekRange.value = savedWordSeekRange;
		}

		// Load the VU meter preference
		const savedVuMeterEnabled = localStorage.getItem('vuMeterEnabled');
		if (savedVuMeterEnabled !== null) {
				vuMeterToggle.checked = savedVuMeterEnabled === 'true';
				toggleVuMeter(vuMeterToggle.checked);
		}
	});

	</script>
</body>
</html>
